name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        env:
          PINGKIT_TEST_API_KEY: ${{ secrets.PINGKIT_TEST_API_KEY }}
        run: echo "PINGKIT_TEST_API_KEY=$PINGKIT_TEST_API_KEY" > .env

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PingKit \
            -destination 'platform=macOS' \
            2>&1 | tee build.log | grep -E '^(Test |  Executed|\*\*)'

      - name: Cleanup
        if: always()
        run: rm -f .env

  test-ios:
    name: iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        env:
          PINGKIT_TEST_API_KEY: ${{ secrets.PINGKIT_TEST_API_KEY }}
        run: echo "PINGKIT_TEST_API_KEY=$PINGKIT_TEST_API_KEY" > .env

      - name: Select simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for rt, devs in json.load(sys.stdin)['devices'].items():
              if 'iOS' in rt:
                  for d in devs:
                      if 'iPhone' in d['name']:
                          print(d['name']); sys.exit()
          print('iPhone 16 Pro')
          ")
          echo "name=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PingKit \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            2>&1 | tee build.log | grep -E '^(Test |  Executed|\*\*)'

      - name: Cleanup
        if: always()
        run: rm -f .env
